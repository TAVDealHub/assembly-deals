<!doctype html>
<title>Assembly Ventures — Deal Room</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg: #F4F3EE; --text: #17160D; --accent: #C8B800; --muted: #7A786E; --border: #D8D5CA; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111008; --text: #EBE9DC; --accent: #D4C400; --muted: #736F5A; --border: #38361E; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; padding: 60px 24px; }
  .wordmark { font-family: Georgia, serif; font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text); margin-bottom: 48px; }
  h1 { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
  .memo-list { list-style: none; max-width: 560px; }
  .memo-list li { border-top: 1px solid var(--border); padding: 20px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .memo-list a { font-size: 17px; color: var(--text); text-decoration: none; font-weight: 500; }
  .memo-list a:hover { color: var(--accent); }
  .tag { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
</style>
<div class="wordmark">Assembly Ventures</div>
<h1>Deal Room</h1>
<ul class="memo-list">
  <li>
    <a href="/hp1">HP-1 — Bridge Round</a>
    <span class="tag">September 2026</span>
  </li>
</ul>
